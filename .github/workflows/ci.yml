name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`: adding `perf-accepted` re-runs the comparison below.
    types: [opened, synchronize, reopened, labeled]
  # By hand, e.g. to run the end-to-end job again.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Arch packages gtk4-layer-shell and every tool the tests call.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git gtk4 gtk4-layer-shell \
            ripgrep poppler unzip zip pkgconf gcc binutils shellcheck

      # Actions are pinned to a commit (a tag can be moved), its tag beside.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch too, for the performance comparison.
          fetch-depth: 0

      # The version build.zig.zon asks for (minimum_zig_version).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      - name: Format
        run: zig fmt --check src build.zig

      - name: Unit and integration tests
        run: zig build test --summary all

      - name: Debug build
        run: zig build

      # As a release is built (SQLite and Lua bundled: not installed above).
      - name: Release build
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-gnu.2.36 \
            --search-prefix /usr --prefix dist
          tools/check-release.sh dist/bin

      - name: Shell scripts
        run: shellcheck --severity=warning install.sh tools/*.sh

      - name: Performance checks
        # Shared runners are slower and noisier than a desktop.
        env:
          PERF_SCALE: "4"
        run: zig build perf

      # The same checks on the base branch, side by side, alternating: fails
      # on a check more than 25% slower, which the limits above (4-5x, and
      # PERF_SCALE) never catch. A PR that trades speed on purpose, or
      # changes what perf measures, carries the `perf-accepted` label: the
      # comparison is still printed, and no longer fails the run.
      - name: Performance against the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'perf-accepted') }}
        env:
          PERF_SCALE: "4"
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/perf-compare.sh "origin/$BASE_REF"

  # The end-to-end suite (tools/e2e.sh) in a headless sway: it drives a real
  # window, so a slow or noisy runner can fail it now and then. It is
  # reported, and never blocks a merge (MYP-475).
  e2e:
    runs-on: ubuntu-latest
    container: archlinux:latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git gtk4 gtk4-layer-shell \
            ripgrep poppler unzip zip pkgconf gcc binutils \
            sway dbus desktop-file-utils shared-mime-info ttf-dejavu

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      - name: Build
        run: zig build

      - name: End-to-end tests
        # Software rendering on a shared runner: every wait and latency
        # limit of the suite, 4 times longer.
        env:
          PERF_SCALE: "4"
        run: tools/e2e-headless.sh zig build e2e
